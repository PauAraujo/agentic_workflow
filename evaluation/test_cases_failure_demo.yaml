# This file contains queries designed to trigger various failure modes
# to demonstrate error handling and repair mechanisms

test_cases:
  # Category 1: Non-existent table/column references
  # These should trigger validation errors (EXPLAIN failures)

  - id: nonexistent_table
    query: "Show me all records from ORDERS table"
    description: "References table that doesn't exist"
    expected_failure: "semantic"
    expected:
      failure_type: "validation_error"
      tables: ["ORDERS"]  # This table doesn't exist
    notes: "Should fail EXPLAIN validation - table not found"

  - id: nonexistent_column_explicit
    query: "Show me PATIENT_NAME and EMAIL from patients"
    description: "Explicitly requests non-existent columns"
    expected_failure: "semantic"
    expected:
      failure_type: "validation_error"
      columns: ["PATIENT_NAME", "EMAIL"]  # These don't exist
    notes: "LLM should try to repair by finding similar columns or omitting them"

  - id: nonexistent_column_filter
    query: "Show me patients where DIAGNOSIS = 'Cancer'"
    description: "Filter on non-existent column"
    expected_failure: "semantic"
    expected:
      failure_type: "validation_error"
      keywords: ["WHERE", "DIAGNOSIS"]
    notes: "DIAGNOSIS column doesn't exist in ICSR_PATIENT table"

  # Category 2: Ambiguous/impossible queries
  # These might generate syntactically valid but semantically wrong SQL

  - id: impossible_aggregation
    query: "Show me the patient with the most average age"
    description: "Logically contradictory query"
    expected_failure: "semantic"
    expected:
      failure_type: "semantic_error"
    notes: "Query doesn't make logical sense - may generate weird SQL"

  - id: missing_join_context
    query: "Show me patients and their medications"
    description: "Requires join to non-existent table"
    expected_failure: "semantic"
    expected:
      tables: ["ICSR_PATIENT"]
      failure_type: "incomplete_query"
    notes: "Medications table doesn't exist - can't fulfill query"

  # Category 3: Type mismatches and data issues
  # These should pass validation but fail at execution

  - id: string_number_comparison
    query: "Show me patients where PATIENT_SEX_ID > 'invalid'"
    description: "String compared to numeric column"
    expected_failure: "execution"
    expected:
      failure_type: "type_mismatch"
      keywords: ["WHERE", "PATIENT_SEX_ID"]
    notes: "May pass validation but fail or return unexpected results at execution"

  - id: invalid_date_format
    query: "Show me patients created on 2023-99-99"
    description: "Invalid date literal"
    expected_failure: "execution"
    expected:
      failure_type: "invalid_date"
      keywords: ["WHERE", "CREATED_ON"]
    notes: "Invalid date should cause execution error or no results"

  # Category 4: Complex queries beyond LLM capability
  # These test the repair loop exhaustion

  - id: extremely_complex_logic
    query: "Show me the median age of patients in the 75th percentile age group, grouped by gender, excluding outliers beyond 2 standard deviations, with a rolling 3-month average"
    description: "Extremely complex statistical query"
    expected_failure: "semantic"
    expected:
      failure_type: "complexity_exceeded"
      keywords: ["GROUP BY"]
    notes: "May generate invalid SQL or miss requirements - tests repair loop"

  - id: recursive_requirement
    query: "Show me patients whose age is greater than the average age of patients in their gender group who are older than 40"
    description: "Requires subquery/CTE that may confuse LLM"
    expected_failure: "semantic"
    expected:
      failure_type: "complex_subquery"
      keywords: ["AVG", "WHERE"]
    notes: "Complex nested logic - may generate incorrect SQL"

  # Category 5: SQL injection attempts (should be escaped/rejected)

  - id: sql_injection_attempt
    query: "Show me patients where name = 'x' OR '1'='1'"
    description: "SQL injection pattern"
    expected_failure: "semantic"
    expected:
      failure_type: "injection_pattern"
    notes: "Should handle safely - LLM generates SQL, doesn't directly interpolate user input"

  # Category 6: Queries requiring unavailable data

  - id: future_data_request
    query: "Show me patients created next year"
    description: "Requests data that can't exist yet"
    expected_failure: "semantic"
    expected:
      failure_type: "no_results"
      keywords: ["WHERE", "CREATED_ON"]
    notes: "Should generate valid SQL but return 0 rows"

  - id: wrong_value_domain
    query: "Show me patients with gender = 'alien'"
    description: "Value outside of domain (valid values: 1=Male, 2=Female)"
    expected_failure: "semantic"
    expected:
      failure_type: "invalid_value"
      keywords: ["WHERE", "PATIENT_SEX_ID"]
    notes: "Should generate valid SQL but return 0 rows (or fail if using string on numeric column)"

  # Category 7: Repair loop edge cases

  - id: intentionally_malformed
    query: "SELECT * FROM WHERE AND OR GROUP"
    description: "SQL-like but nonsensical query"
    expected_failure: "workflow"
    expected:
      failure_type: "interpretation_failed"
    notes: "Tests if interpreter can handle SQL-like input vs natural language"

  - id: empty_query
    query: ""
    description: "Empty query string"
    expected_failure: "workflow"
    expected:
      failure_type: "empty_input"
    notes: "Should fail gracefully at workflow level"

  # Category 8: Edge cases that might pass but with warnings

  - id: select_star_no_limit
    query: "Show me everything from all patients ever"
    description: "Unrestricted SELECT * (performance concern)"
    expected_failure: "none"
    expected:
      keywords: ["SELECT", "FROM"]
      min_rows: 1
    notes: "Should succeed but return all 999 rows - demonstrates performance consideration"

# Metadata
metadata:
  version: "1.0"
  purpose: "Demonstrate failure handling"
  total_test_cases: 15
  categories:
    - nonexistent_references: 3
    - impossible_logic: 2
    - type_mismatches: 2
    - complexity: 2
    - security: 1
    - data_issues: 2
    - edge_cases: 3
  created: "2025-12-16"
  last_updated: "2025-12-16"
  notes: |
    This file is designed for demonstration and testing purposes.
    Not all queries are expected to fail - some are edge cases that
    may succeed but demonstrate important system behavior.

    Use: python run_evaluation.py --test-file test_cases_failure_demo.yaml
